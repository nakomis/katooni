name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Validate the post-merge state on PRs, not just the branch tip.
env:
  CHECKOUT_REF: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/merge', github.event.pull_request.number) || github.sha }}

jobs:
  core:
    name: Core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - name: Build and test the portable core (gcc)
        run: |
          cmake -S embedded/core -B build/core -DCMAKE_C_COMPILER=gcc
          cmake --build build/core
          ctest --test-dir build/core --output-on-failure
      - name: Build and test the portable core (clang)
        run: |
          cmake -S embedded/core -B build/core-clang -DCMAKE_C_COMPILER=clang
          cmake --build build/core-clang
          ctest --test-dir build/core-clang --output-on-failure
      - name: Simulator and web API tests
        run: |
          cmake -S embedded/sim -B build/sim
          cmake --build build/sim
          ctest --test-dir build/sim --output-on-failure -R sim

  firmware:
    name: Firmware build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - name: idf.py build (ESP-IDF 5.5, ESP32-S3)
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5
          target: esp32s3
          path: embedded

  infra:
    name: Infra tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: infra/package.json
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '25'
          cache: 'pnpm'
          cache-dependency-path: infra/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm test
      - run: pnpm run ci-synth-sandbox
